<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check-label">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="muted">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="error-text">{{ error }}</small>{% endfor %}
</div>
